dataset:
  name: deepcrack
  root: data
  image_size: 128
  validation_fraction: 0.20
  split_seed: 42

model:
  name: unet
  encoder: resnet18
  pretrained: true
  num_classes: 2

training:
  batch_size: 4
  epochs: 15
  learning_rate: 0.0001
  weight_decay: 0.00001
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 5
  loss_dice_weight: 0.7
  loss_ce_weight: 0.3
  foreground_class_weight: 3.0

runtime:
  seed: 42
  deterministic: true
  num_workers: 0
