<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DeepCrack evaluation-safe v2 pipeline</title><desc id="desc">Official training records are deterministically divided into training and validation; the official test set stays held out until final evaluation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1014"/><stop offset="1" stop-color="#48252a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="65" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">DeepCrack · Evaluation-Safe v2 Protocol</text><text x="65" y="117" fill="#ffd4d4" font-family="Arial,sans-serif" font-size="19">Strict image / mask pairing · no test leakage · foreground crack metrics</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)"><rect x="65" y="185" width="275" height="220" rx="18" fill="#ffede8"/><text x="94" y="235" fill="#7b231d" font-size="24" font-weight="700">Official train folders</text><text x="94" y="273" fill="#754b46" font-size="18">train_img + train_lab</text><text x="94" y="305" fill="#754b46" font-size="18">Every mask must exist</text><text x="94" y="337" fill="#754b46" font-size="18">No silent empty masks</text>
  <rect x="465" y="165" width="290" height="260" rx="18" fill="#fff7d9"/><text x="495" y="220" fill="#7a5200" font-size="24" font-weight="700">Development only</text><text x="495" y="260" fill="#70592f" font-size="18">Deterministic train / validation</text><text x="495" y="293" fill="#70592f" font-size="18">Checkpoint selection by</text><text x="495" y="324" fill="#70592f" font-size="18">foreground crack IoU</text><text x="495" y="365" fill="#70592f" font-size="18">Split manifest persisted</text>
  <rect x="860" y="185" width="275" height="220" rx="18" fill="#e8f7ff"/><text x="890" y="235" fill="#124f70" font-size="24" font-weight="700">Official test folders</text><text x="890" y="273" fill="#365f75" font-size="18">test_img + test_lab</text><text x="890" y="305" fill="#365f75" font-size="18">Held out until final</text><text x="890" y="337" fill="#365f75" font-size="18">evaluation exactly once</text></g>
  <g stroke="#ffbf6d" stroke-width="5" fill="none"><path d="M340 295H445"/><path d="M755 295H840"/></g><g fill="#ffbf6d"><path d="M445 286l16 9-16 9z"/><path d="M840 286l16 9-16 9z"/></g>
  <rect x="65" y="480" width="1070" height="70" rx="14" fill="#6d3032"/><text x="94" y="522" fill="#fff2eb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Result dashboard = training history + held-out test metrics + checkpoint metadata</text><text x="94" y="548" fill="#ffd9ca" font-family="Arial,sans-serif" font-size="16">No static headline metrics; no dashboard is published until a run is reproducible.</text>
</svg>
