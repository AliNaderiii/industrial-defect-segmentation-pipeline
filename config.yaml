# Reproducible DeepCrack binary-segmentation experiment.
dataset:
  name: deepcrack
  root: data
  image_size: 256
  # The official `test_*` directories are never used for model selection.
  # Validation is deterministically drawn only from the official train folders.
  validation_fraction: 0.20
  split_seed: 42

model:
  name: unet                 # unet, deeplabv3plus, fpn
  encoder: resnet18
  pretrained: true
  num_classes: 2

training:
  batch_size: 8
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  scheduler_patience: 4
  scheduler_factor: 0.5
  early_stopping_patience: 8
  # foreground Dice and foreground-weighted CE address sparse crack pixels.
  loss_dice_weight: 0.7
  loss_ce_weight: 0.3
  foreground_class_weight: 3.0

runtime:
  seed: 42
  deterministic: true
  num_workers: 0
